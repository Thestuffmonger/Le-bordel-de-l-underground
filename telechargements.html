<!-- FICHIER : Résolveur IP (Généré en direct sans erreur 404) -->
        <div class="file-dump">
            <h3>ip-resolver.txt</h3>
            <p>Un petit script front-end dégueulasse pour choper l'adresse IP d'un nom de domaine directement à l'arrache depuis le navigateur.</p>
            <span style="font-family: monospace; font-size: 0.8rem; color: #555;">Format : Texte Brut (.txt)</span><br>
            <button onclick="downloadScript()" style="background-color: #0000ff; color: #ffffff; padding: 5px 10px; font-family: monospace; font-weight: bold; cursor: pointer; border: 1px solid #000; margin-top: 8px;">[ TÉLÉCHARGER LE CODE ]</button>
        </div>

        <script>
            function downloadScript() {
                // Le code source brut intégré directement dans le script
                const codeContent = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IP Grabber de bas étage</title>
    <style>
        body { background: #fff; color: #000; font-family: monospace; padding: 20px; }
    </style>
</head>
<body>
    <h3>Résolveur IP à l'arrache</h3>
    <input type="text" id="siteInput" placeholder="ex: google.com">
    <button onclick="resolveIP()">CHERCHER</button>
    <p id="resultat"></p>

    <script>
        function resolveIP() {
            let site = document.getElementById('siteInput').value.trim();
            site = site.replace(/(^\\w+:|^)\\/\\//, '').replace(/\\/.*$/, '');
            if(!site) return;
            
            fetch('https://dns.google/resolve?name=' + site)
                .then(response => response.json())
                .then(data => {
                    if(data.Answer) {
                        let ip = data.Answer.find(record => record.type === 1);
                        document.getElementById('resultat').innerHTML = ip ? "IP de " + site + " : " + ip.data : "Introuvable.";
                    } else {
                        document.getElementById('resultat').innerHTML = "Erreur de résolution.";
                    }
                })
                .catch(err => {
                    document.getElementById('resultat').innerHTML = "Erreur réseau.";
                });
        }
    <\/script>
</body>
</html>`;

                // Création d'un fichier virtuel et déclenchement du téléchargement
                const blob = new Blob([codeContent], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'ip-resolver.txt';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        </script>
